<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background: linear-gradient(to right, #212331, #517ef8); 
            color: #ffffff;
            font-family: 'Georgia', serif;
        }
        h1 {
            color: #ffffff;
        }
        p {
            font-size: 18px;
        }

        .button {
        background-color: #008CBA;
        border: none;
        color: white;
        padding: 10px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 8px 2px;
        cursor: pointer;
        border-radius: 12px;
        box-shadow: 0 5px #666;
        }

        .button:hover {
        background-color: #007bb5;
        }

        .button:active {
        background-color: #007bb5;
        box-shadow: 0 2px #666;
        transform: translateY(1px); /*Animation*/
        }

    </style>
</head>
<body>
    <h1>Thank You for Contacting Us!</h1>
    <p>We will get back to you as soon as possible.</p>
    <i class="material-icons" style="font-size:300px">tag_faces</i>
    <form action="index.html" method="get">                              <!--User can go bak to index.html page by clicking the button-->
        <button type="submit" class="button">Go Back</button>
    </form>
</body>
</html>
